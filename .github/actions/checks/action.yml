name: Quality gate
description: Default and acceptance Rust coverage plus frontend checks
runs:
  using: composite
  steps:
    - name: 根库 cargo fmt --check
      shell: pwsh
      run: cargo fmt --all -- --check

    - name: 根库 cargo clippy
      shell: pwsh
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

    - name: 根库 cargo test
      shell: pwsh
      run: cargo test --locked --workspace

    - name: 壳 cargo fmt --check
      shell: pwsh
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

    - name: 壳 cargo clippy
      shell: pwsh
      run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

    - name: 壳 cargo test
      shell: pwsh
      run: cargo test --locked --manifest-path src-tauri/Cargo.toml

    - name: frontend typecheck
      shell: pwsh
      run: pnpm --dir frontend typecheck

    - name: frontend format:check
      shell: pwsh
      run: pnpm --dir frontend format:check

    - name: frontend test
      shell: pwsh
      run: pnpm --dir frontend test

    - name: frontend build
      shell: pwsh
      run: pnpm --dir frontend build
    - name: 根库 acceptance clippy
      shell: pwsh
      run: cargo clippy --locked --workspace --all-targets --features acceptance -- -D warnings
    - name: 根库 acceptance test
      shell: pwsh
      run: cargo test --locked --workspace --features acceptance
    - name: 壳 acceptance clippy
      shell: pwsh
      run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --features acceptance -- -D warnings
    - name: 壳 acceptance test
      shell: pwsh
      run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features acceptance
    - name: Release metadata tests
      shell: pwsh
      run: python -m unittest discover -s scripts -p "test_release_metadata.py" -v

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# 每个 main 提交独立完成发布；重跑同一提交才互相替换。
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      title: ${{ steps.metadata.outputs.title }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      latest: ${{ steps.metadata.outputs.latest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate one version increment for this main merge
        run: |
          python -B scripts/bump_version.py --check --event-file "$env:GITHUB_EVENT_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate release identity and versions
        id: metadata
        run: python scripts/release_metadata.py
      - uses: ./.github/actions/checks

  build:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build production Windows x64 NSIS (without acceptance)
        run: node ./frontend/node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis --target x86_64-pc-windows-msvc -- --locked
      - name: Collect installer and checksums
        run: |
          python -B scripts/release_assets.py collect --bundle target/x86_64-pc-windows-msvc/release/bundle/nsis --executable target/x86_64-pc-windows-msvc/release/tokenscope.exe --directory release-assets --commit '${{ needs.gate.outputs.sha }}' --version '${{ needs.gate.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attest installer checksums and build identity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
          create-storage-record: false
      - name: Include downloadable attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination release-assets/provenance.sigstore.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  install-test:
    needs: [gate, build]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: installer
      - name: Verify current installer and build identity
        run: |
          python -B scripts/release_assets.py verify --directory installer --commit '${{ needs.gate.outputs.sha }}' --version '${{ needs.gate.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install / first-launch migration / reinstall / uninstall scenarios
        run: |
          $files = @(Get-ChildItem installer/*-setup.exe)
          if ($files.Count -ne 1) { throw "必须有唯一当前安装包" }
          $installParameters = @{
            InstallerPath = $files[0].FullName
            AppVersion = '${{ needs.gate.outputs.version }}'
          }
          & ./scripts/test_install.ps1 @installParameters
          exit $LASTEXITCODE
      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: install-evidence-release-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/tokenscope-install-evidence
          if-no-files-found: ignore
          retention-days: 14

  upgrade-test:
    needs: [gate, build]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source_state: [present, deleted]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: installer
      - name: Run real 0.1.0 upgrade
        run: |
          $files = @(Get-ChildItem installer/*-setup.exe)
          if ($files.Count -ne 1) { throw "必须有唯一当前安装包" }
          $upgradeParameters = @{
            InstallerPath = $files[0].FullName
            AppVersion = '${{ needs.gate.outputs.version }}'
            ExpectedCommit = '${{ needs.gate.outputs.sha }}'
            SourceState = '${{ matrix.source_state }}'
          }
          & ./scripts/test_upgrade.ps1 @upgradeParameters
          exit $LASTEXITCODE
      - name: Upload real upgrade evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upgrade-evidence-release-${{ needs.gate.outputs.sha }}-${{ matrix.source_state }}
          path: ${{ runner.temp }}/tokenscope-install-evidence
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [gate, build, install-test, upgrade-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: release-assets
      - name: Backfill immutable 0.1.0 and publish current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release_assets.py publish --directory release-assets --commit '${{ needs.gate.outputs.sha }}' --version '${{ needs.gate.outputs.version }}'

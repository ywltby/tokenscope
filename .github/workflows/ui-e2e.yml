name: Native UI E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ui:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Owned native window selection contract
        shell: pwsh
        run: ./scripts/test_native_window_action.ps1
      - name: Build embedded frontend and isolated acceptance executable
        shell: pwsh
        run: |
          pnpm --dir frontend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p tokenscope-app --release --features acceptance,tauri/custom-protocol --bin tokenscope
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real WebView2 and Rust refresh lifecycle
        shell: pwsh
        run: node frontend/scripts/native-acceptance.mjs --scenario ui-refresh --events 4 --port 9451 --out qa-artifacts/ui-adjustment/native-e2e
      - name: Native window restore and settings persistence
        shell: pwsh
        run: |
          # UP09（升级矩阵 §4.8 第 1 条）：各步起始端口互不重叠，进程内第 n 次启动用 --port + n。
          node frontend/scripts/native-acceptance.mjs --scenario ui-system --events 4 --port 9460 --out qa-artifacts/ui-adjustment/native-e2e/system
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Runner 的系统 DPI 轮本身就是 dpr=1、视口 980×620，与强制缩放 1 那一轮完全相同，
          # 故不再重复跑 --scale 1；需要时本地可手动传该参数。
          $ports = @{ '1.5' = 9480; '2' = 9490 }
          foreach ($scale in @('1.5', '2')) {
            node frontend/scripts/native-acceptance.mjs --scenario ui-system --events 4 --scale $scale --port $ports[$scale] --out "qa-artifacts/ui-adjustment/native-e2e/layout-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # PR2：真实采集生命周期 + 读取显示期 + 失败恢复 + 翻页保护（3 次启动，
      # 起始端口 9470，进程内递增；与其余步骤的端口段互不重叠）。
      - name: Native collection status lifecycle
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario ui-collection-status --events 250 --port 9470 --out qa-artifacts/ui-adjustment/native-e2e/collection-status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # PR3：来源目录主线（§9.6 第 2 条）——UI 追加手动目录、真实下一轮统计、
      # 重启后保留且不重复计数（2 次启动，起始端口 9455）。
      - name: Native source paths lifecycle
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario ui-source-paths --events 4 --port 9455 --out qa-artifacts/ui-adjustment/native-e2e/source-paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # AC03–AC05：三个统一验收场景分别预留十个启动端口，失败直接传递。
      - name: Native project and model identity with history retention
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario ui-identity --events 8 --port 9500 --out qa-artifacts/ui-adjustment/native-e2e/identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native CCS manual import lifecycle
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario ui-ccs-import --events 8 --port 9510 --out qa-artifacts/ui-adjustment/native-e2e/ccs-import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native pricing sync and cost disclosure
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario ui-pricing --events 8 --port 9520 --out qa-artifacts/ui-adjustment/native-e2e/pricing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # AC06：隐私原生取证五场景（确定性；本地三连跑实测合计 112 秒）。
      # 预置业务文件未同意观察（1 次启动，起始端口 9530）。
      - name: Native privacy preseeded files untouched
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario privacy-preseeded --events 8 --port 9530 --out qa-artifacts/ui-adjustment/native-e2e/privacy-preseeded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 全量受保护 IPC 拒绝 + 全蜂巢注册表只读快照（1 次启动，起始端口 9533）。
      - name: Native privacy denied IPC over protected commands
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario privacy-denied-ipc --events 8 --port 9533 --out qa-artifacts/ui-adjustment/native-e2e/privacy-denied-ipc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 同意顺序与双击单次初始化（1 次启动，起始端口 9536）。
      - name: Native privacy accept order and single save
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario privacy-accept-order --events 8 --port 9536 --out qa-artifacts/ui-adjustment/native-e2e/privacy-accept-order
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 损坏 TOML 阻断弹窗且文件不变（1 次启动，起始端口 9539）。
      - name: Native privacy corrupt settings blocked
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario privacy-variants-corrupt --events 8 --port 9539 --out qa-artifacts/ui-adjustment/native-e2e/privacy-variants-corrupt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # close_action 记忆预设不得绕过隐私退出确认（1 次启动，起始端口 9542）。
      - name: Native privacy close preset still asks
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario privacy-variants-close --events 8 --port 9542 --out qa-artifacts/ui-adjustment/native-e2e/privacy-variants-close
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 修订 2 旧用户真实界面重新同意（2 次启动，起始端口 9545）：门禁关闭→点击同意→重启不询问。
      - name: Native revision2 old user reconsents through UI
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario privacy-revision2-consent --events 8 --port 9545 --out qa-artifacts/ui-adjustment/native-e2e/privacy-revision2-consent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: native-ui-evidence
          path: qa-artifacts/ui-adjustment/native-e2e
          if-no-files-found: warn

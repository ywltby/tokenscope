[package]
name = "tokenscope"
version = "0.1.0"
edition = "2024"
description = "本地 AI agent 使用量统计工具（对标 cc-switch Usage Statistics 的独立实现）"
license = "MIT"

[workspace]
members = ["src-tauri"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "6"
jiff = "0.2"
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }

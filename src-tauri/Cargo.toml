[package]
name = "tokenscope-app"
version = "0.3.1"
edition = "2024"
description = "TokenScope 桌面应用壳（Tauri 2 + Vue 3）"
license = "MIT"

[lib]
name = "tokenscope_tauri_lib"
crate-type = ["rlib"]

# GUI 进程名 tokenscope.exe：唯一应用二进制，核心库在 crates/tokenscope-core。
[[bin]]
name = "tokenscope"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 默认构建不含验收入口（与核心库一致：普通构建行为完全不变）。
default = []
# RC10：显式透传核心库同名 feature——`tauri build --features acceptance` 只
# 会传到这里，核心库的 acceptance 分支必须随之启用，否则隔离根解析不到、
# 验收实例会带着真实 HOME 启动。
acceptance = ["tokenscope/acceptance"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokenscope = { path = "../crates/tokenscope-core" }
tauri-plugin-opener = "2.7.0"
anyhow = { workspace = true }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-autostart = "2.7.0"
log = { workspace = true }
jiff = { workspace = true }

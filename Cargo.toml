[workspace]
members = ["crates/tokenscope-core", "src-tauri"]
default-members = ["crates/tokenscope-core", "src-tauri"]
resolver = "3"

# 共享依赖集中声明，成员以 `workspace = true` 继承；各成员需要的 features
# 仍在该成员内显式声明。仅壳使用的 Tauri/plugin 依赖留在壳中。
[workspace.dependencies]
anyhow = "1.0.104"
jiff = "0.2.37"
log = "0.4.34"
serde = "1"
serde_json = "1"

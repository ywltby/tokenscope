[package]
name = "tokenscope"
version = "0.1.0"
edition = "2024"
description = "本地 AI agent 使用量统计工具（对标 cc-switch Usage Statistics 的独立实现）"
license = "MIT"

[workspace]
# src-tauri 独立构建（自带 target 目录）：GUI 与 CLI 可执行文件同名
# tokenscope.exe 而互不覆盖
exclude = ["src-tauri"]

[features]
# 默认构建不含验收入口（产品构建行为完全不变）。
default = []
# RC10：原生生产验收——只有该 feature 的构建识别 TOKENSCOPE_ACCEPTANCE_ROOT，
# 并把所有落盘路径（数据目录、来源根、日志、窗口状态、WebView 用户数据）
# 重定向到隔离根；缺失/非法时拒绝启动，绝不回退真实 HOME。
acceptance = []

[dev-dependencies]
# H01+：集成测试需要直接构造/检查 SQLite fixture（旧版历史库、CCS 来源库）。
# 与主依赖同版本同 features，cargo 复用同一份构建，不引入新依赖树。
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dependencies]
anyhow = "1"
dirs = "6"
# RC01：查询身份跨启动唯一——进程启动时取 128 位系统随机命名空间。
# 已在锁文件中作为 ring→rustls→ureq 的传递依赖存在；此处显式声明为直接
# 依赖（不依赖传递依赖的可用性），版本与锁一致，离线可解析。
getrandom = "0.2"
jiff = "0.2"
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
# A01：`file://` 项目路径按 URI 语义解析（锁定版本，已在依赖图中）。
url = "2.5.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }

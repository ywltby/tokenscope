name: Native UI E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ui:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Owned native window selection contract
        shell: pwsh
        run: ./scripts/test_native_window_action.ps1
      - name: Build embedded frontend and isolated acceptance executable
        shell: pwsh
        run: |
          pnpm --dir frontend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p tokenscope-app --release --features acceptance,tauri/custom-protocol --bin tokenscope
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real WebView2 and Rust refresh lifecycle
        shell: pwsh
        run: node frontend/scripts/native-acceptance.mjs --scenario ui-refresh --events 4 --port 9451 --out qa-artifacts/ui-adjustment/native-e2e
      - name: Native window restore and settings persistence
        shell: pwsh
        run: |
          # UP09（升级矩阵 §4.8 第 1 条）：各步起始端口互不重叠，进程内第 n 次启动用 --port + n。
          node frontend/scripts/native-acceptance.mjs --scenario ui-system --events 4 --port 9460 --out qa-artifacts/ui-adjustment/native-e2e/system
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Runner 的系统 DPI 轮本身就是 dpr=1、视口 980×620，与强制缩放 1 那一轮完全相同，
          # 故不再重复跑 --scale 1；需要时本地可手动传该参数。
          $ports = @{ '1.5' = 9480; '2' = 9490 }
          foreach ($scale in @('1.5', '2')) {
            node frontend/scripts/native-acceptance.mjs --scenario ui-system --events 4 --scale $scale --port $ports[$scale] --out "qa-artifacts/ui-adjustment/native-e2e/layout-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # PR2：真实采集生命周期 + 读取显示期 + 失败恢复 + 翻页保护（3 次启动，
      # 起始端口 9470，进程内递增；与其余步骤的端口段互不重叠）。
      - name: Native collection status lifecycle
        shell: pwsh
        run: |
          node frontend/scripts/native-acceptance.mjs --scenario ui-collection-status --events 250 --port 9470 --out qa-artifacts/ui-adjustment/native-e2e/collection-status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: native-ui-evidence
          path: qa-artifacts/ui-adjustment/native-e2e
          if-no-files-found: warn

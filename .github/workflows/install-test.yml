name: Install test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'crates/tokenscope-core/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release-change.json'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'docs/privacy.md'
      - 'docs/terms.md'

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-test:
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      sha: ${{ steps.app_version.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read application version
        id: app_version
        run: |
          $version = (python -c "import json; print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "版本不是 0.x.y" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          $sha = (git rev-parse HEAD).Trim()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha=$sha"
      - name: Install and upgrade contracts before production build
        run: |
          python -B -m unittest discover -s scripts -p "test_*version.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts -p "test_release_assets.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts -p "test_install_workflow.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts -p "test_inspect_history.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts -p "test_upgrade*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/test_install_helpers.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/test_upgrade_helpers.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build production Windows x64 NSIS (without acceptance)
        run: node ./frontend/node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis --target x86_64-pc-windows-msvc -- --locked
      - name: Collect current installer and build identity
        run: |
          python -B scripts/release_assets.py print-persistent-format --output persistent-format.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/release_assets.py collect --bundle target/x86_64-pc-windows-msvc/release/bundle/nsis --executable target/x86_64-pc-windows-msvc/release/tokenscope.exe --directory current-installer --commit '${{ steps.app_version.outputs.sha }}' --version '${{ steps.app_version.outputs.version }}' --persistent-format persistent-format.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload current installer for isolated upgrade jobs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: install-build-${{ github.run_id }}
          path: current-installer/*
          if-no-files-found: error
          retention-days: 14
      - name: Run install / first-launch migration / reinstall / uninstall scenarios
        run: |
          $files = @(Get-ChildItem current-installer/*-setup.exe)
          if ($files.Count -ne 1) { throw "必须有唯一当前安装包" }
          $installParameters = @{
            InstallerPath = $files[0].FullName
            AppVersion = '${{ steps.app_version.outputs.version }}'
          }
          & ./scripts/test_install.ps1 @installParameters
          exit $LASTEXITCODE
      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: install-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/tokenscope-install-evidence
          if-no-files-found: ignore
          retention-days: 14

  plan-upgrades:
    needs: install-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select upgrade origins from the checked-in registry
        id: plan
        shell: pwsh
        run: |
          $selection = python -B scripts/upgrade_baselines.py select --current-version '${{ needs.install-test.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $include = @(($selection | ConvertFrom-Json).include)
          if ($include.Count -eq 0) { throw "起点集合为空：不能用空矩阵当通过" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("include=" + ($include | ConvertTo-Json -Compress -Depth 5 -AsArray))

  upgrade-test:
    needs: [install-test, plan-upgrades]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-upgrades.outputs.include) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: install-build-${{ github.run_id }}
          path: installer
      - name: Run real upgrade from ${{ matrix.origin }}
        run: |
          $files = @(Get-ChildItem installer/*-setup.exe)
          if ($files.Count -ne 1) { throw "必须有唯一当前安装包" }
          $upgradeParameters = @{
            InstallerPath = $files[0].FullName
            AppVersion = '${{ needs.install-test.outputs.version }}'
            ExpectedCommit = '${{ needs.install-test.outputs.sha }}'
            SourceState = '${{ matrix.source_state }}'
            Origin = '${{ matrix.origin }}'
          }
          & ./scripts/test_upgrade.ps1 @upgradeParameters
          exit $LASTEXITCODE
      - name: Upload real upgrade evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upgrade-evidence-${{ github.run_id }}-${{ matrix.origin }}-${{ matrix.source_state }}
          path: ${{ runner.temp }}/tokenscope-install-evidence
          if-no-files-found: ignore
          retention-days: 14

  upgrade-chain:
    # 连续升级链只在手动触发时跑：PR 侧保留单跳矩阵，链是发布前置条件。
    if: github.event_name == 'workflow_dispatch'
    needs: install-test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source_state: [present, deleted]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: install-build-${{ github.run_id }}
          path: installer
      - name: Run chained upgrades
        run: |
          $files = @(Get-ChildItem installer/*-setup.exe)
          if ($files.Count -ne 1) { throw "必须有唯一当前安装包" }
          $chainParameters = @{
            InstallerPath = $files[0].FullName
            AppVersion = '${{ needs.install-test.outputs.version }}'
            ExpectedCommit = '${{ needs.install-test.outputs.sha }}'
            SourceState = '${{ matrix.source_state }}'
          }
          & ./scripts/test_upgrade_chain.ps1 @chainParameters
          exit $LASTEXITCODE
      - name: Upload chained upgrade evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upgrade-chain-evidence-${{ github.run_id }}-${{ matrix.source_state }}
          path: ${{ runner.temp }}/tokenscope-install-evidence
          if-no-files-found: ignore
          retention-days: 14

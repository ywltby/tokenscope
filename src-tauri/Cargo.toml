[package]
name = "tokenscope-tauri"
version = "0.1.0"
edition = "2024"
description = "TokenScope 桌面应用壳（Tauri 2 + Vue 3）"
license = "MIT"

[lib]
name = "tokenscope_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenscope = { path = ".." }
tauri-plugin-opener = "2.7.0"

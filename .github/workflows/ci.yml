name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 四个检查组各跑一个作业，互不依赖，在 Runner 上并行。步骤与命令全部来自
  # .github/actions/checks（用 group 选择），检查项与拆分前一一对应。
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/checks
        with:
          group: rust

  rust-acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/checks
        with:
          group: rust-acceptance

  contracts:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 版本递增与升级登记表检查要读完整 git 历史，只有本作业需要 fetch-depth: 0
      # （GH_TOKEN 由动作内的步骤自己取 github.token）。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/checks
        with:
          group: contracts

  frontend:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/checks
        with:
          group: frontend

  # 汇总作业：四个组全部成功它才通过。作业名保持 gate，规则集 protect-main 的
  # 必需检查不用改；任一依赖失败、取消或跳过都在这里判失败。
  gate:
    needs:
      - rust
      - rust-acceptance
      - contracts
      - frontend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every check group to pass
        run: |
          names=(rust rust-acceptance contracts frontend)
          results=("${{ needs.rust.result }}" "${{ needs.rust-acceptance.result }}" "${{ needs.contracts.result }}" "${{ needs.frontend.result }}")
          failed=0
          for i in "${!names[@]}"; do
            echo "${names[$i]}=${results[$i]}"
            if [ "${results[$i]}" != "success" ]; then
              echo "::error::检查组 ${names[$i]} 的结果是 ${results[$i]}，不是 success"
              failed=1
            fi
          done
          exit "$failed"
